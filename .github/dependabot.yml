# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    # Emotion 11 moves ThemeProvider to @emotion/react, so the v10 -> v11 bump
    # is a coordinated migration rather than a dependency update. Ignore the
    # major only; 10.x patches (including security fixes) still come through.
    ignore:
      - dependency-name: "emotion-theming"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "@emotion/styled"
        update-types: [ "version-update:semver-major" ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
